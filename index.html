<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEBULA — 552 tools, one sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#06080f; color:#eef2f8; font-family:'Outfit',sans-serif; }
  #sky { position:fixed; inset:0; display:block; cursor:grab; }
  #sky.dragging { cursor:grabbing; }
  .chrome { position:fixed; z-index:10; }
  #topbar { top:0; left:0; right:0; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 24px;
            background:linear-gradient(180deg,rgba(6,8,15,.9),rgba(6,8,15,0)); }
  #brand { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:.34em; color:#eef2f8; user-select:none; }
  #brand em { font-style:normal; color:#ffb454; }
  #search { width:240px; font-family:'Outfit',sans-serif; font-size:13px; color:#cdd6e4; background:rgba(255,255,255,.045);
            border:1px solid #1e2735; border-radius:999px; padding:9px 18px; outline:none; letter-spacing:.02em; }
  #search::placeholder { color:#5f6b80; }
  #search:focus { border-color:#2a3648; }
  #controls { display:flex; align-items:center; gap:14px; }
  #play { width:34px; height:34px; border-radius:50%; border:1px solid #2a3648; background:rgba(255,255,255,.03); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #play:hover { border-color:#ffb454; }
  #play .tri { border-left:9px solid #ffb454; border-top:6px solid transparent; border-bottom:6px solid transparent; margin-left:3px; }
  #play.playing .tri { border-left:none; border-right:7px solid #ffb454; border-top:7px solid #ffb454; border-bottom:7px solid #ffb454; margin-left:0; }
  #track { width:200px; height:3px; background:#1e2735; border-radius:2px; position:relative; }
  #track .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#3a4860,#ffb454); border-radius:2px; }
  #day { font-family:'JetBrains Mono',monospace; font-size:12px; color:#ffb454; letter-spacing:.08em; min-width:86px; }
  #slider { position:absolute; left:0; top:50%; transform:translateY(-50%); width:200px; height:22px; margin:0; opacity:0; cursor:pointer; }
  #reset { font-family:'JetBrains Mono',monospace; font-size:11px; color:#5f6b80; background:none; border:none; cursor:pointer; letter-spacing:.1em; }
  #reset:hover { color:#eef2f8; }
  #signal { left:24px; bottom:22px; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#7c8698; letter-spacing:.04em; display:flex; gap:20px; align-items:center; }
  #signal b { color:#eef2f8; font-weight:600; }
  #signal .up { color:#ffb454; }
  #signal .dot { width:7px; height:7px; border-radius:50%; background:#ffb454; box-shadow:0 0 10px #ffb454; }
  #panel { right:0; top:64px; bottom:0; width:330px; padding:26px 24px; overflow-y:auto;
           background:linear-gradient(180deg,rgba(10,14,22,.88),rgba(8,11,18,.94)); border-left:1px solid #1e2735;
           transform:translateX(100%); transition:transform .28s cubic-bezier(.16,1,.3,1); }
  #panel.open { transform:translateX(0); }
  #panel h2 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:.24em; color:#eef2f8; margin-bottom:3px; }
  #panel .sub { font-family:'JetBrains Mono',monospace; font-size:11px; color:#ffb454; letter-spacing:.12em; margin-bottom:18px; }
  #panel .row { padding:8px 0; border-bottom:1px solid #121927; cursor:pointer; }
  #panel .row:last-child { border-bottom:0; }
  #panel .row:hover .n { color:#fff; }
  #panel .row .top { display:flex; justify-content:space-between; align-items:baseline; }
  #panel .row .n { font-size:13px; color:#cdd6e4; display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  #panel .row .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #panel .row .sw { width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 8px currentColor; }
  #panel .row .s { font-family:'JetBrains Mono',monospace; font-size:12px; color:#7c8698; flex:none; }
  #panel .row .tag { font-size:12px; color:#5f6b80; font-family:'Outfit',sans-serif; margin-left:18px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #panel::-webkit-scrollbar { width:8px; }
  #panel::-webkit-scrollbar-thumb { background:#1e2735; border-radius:4px; }
  #panel::-webkit-scrollbar-track { background:transparent; }
  #panel .empty { color:#5f6b80; font-size:13px; padding:14px 0; }
  #hint { right:24px; bottom:22px; font-family:'JetBrains Mono',monospace; font-size:11px; color:#3a4860; letter-spacing:.08em; text-align:right; }
  #hint b { color:#5f6b80; font-weight:400; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="chrome" id="topbar">
  <div id="brand">NEBU<em>LA</em></div>
  <input id="search" type="text" placeholder="search the sky&hellip;">
  <div id="controls">
    <button id="reset" title="reset view">RESET</button>
    <button id="play" title="play the 37 days" aria-label="play the 37 days"><span class="tri"></span></button>
    <div id="track"><div class="fill" id="fill"></div><input id="slider" type="range" min="0" max="0" value="0"></div>
    <div id="day">day 37 / 37</div>
  </div>
</div>

<div class="chrome" id="signal">
  <span class="dot"></span>
  <span id="sTools"><b>0</b> tools</span>
  <span id="sSplit">-</span>
  <span id="sRising"></span>
  <span id="sGap"></span>
</div>

<div class="chrome" id="hint"><b>drag</b> pan · <b>scroll</b> zoom · <b>click</b> a constellation</div>

<div class="chrome" id="panel">
  <h2 id="pTitle">-</h2>
  <div class="sub" id="pSub">-</div>
  <div id="pRows"></div>
</div>

<script>
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = devicePixelRatio || 1;

function resize(){
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (DATA) computeSpiral();
  draw();
}
addEventListener('resize', resize);

// ---------- state ----------
let DATA = null;            // app.json
let day = 0;                // day index
let selected = null;        // category index, or null
let searchQ = '';
let playing = false;
let playTimer = null;
const view = { k:1, x:0, y:0 };

const $ = id => document.getElementById(id);
const slider = $('slider'), fill = $('fill'), dayLabel = $('day');

// ---------- layout: golden spiral ----------
let bubblePos = []; // per cat: {x,y}
function computeSpiral(){
  const cx = W/2, cy = H/2 - 30;
  bubblePos = DATA.categories.map((_, i) => {
    const a = i * 2.39996;
    const r = Math.max(W,H)*0.16 + 108 * Math.sqrt(i+1);
    return { x: cx + Math.cos(a)*r*0.8, y: cy + Math.sin(a)*r*0.6 };
  });
}
function bubbleR(count){ return Math.max(22, Math.sqrt(count)*4.5); }

// ---------- signals computed once ----------
let risingCats = new Set(), gapCats = new Set();
function computeSignals(){
  const n = DATA.dates.length;
  const recent = new Map(), prior = new Map();
  const scored = new Map(), counts = new Map();
  for (const t of DATA.tools){
    const c = t[6];
    if (t[5] >= n-7) recent.set(c, (recent.get(c)||0)+1);
    if (t[5] >= n-21 && t[5] < n-7) prior.set(c, (prior.get(c)||0)+1);
    if (t[2] > 0){ const s = scored.get(c)||[]; s.push(t[2]); scored.set(c, s); }
    counts.set(c, (counts.get(c)||0)+1);
  }
  for (let c=0; c<DATA.categories.length; c++){
    const rc = recent.get(c)||0, pc = prior.get(c)||0;
    if (rc >= 3 && rc/7 > (pc/14)*1.2) risingCats.add(c);
  }
  const avgs = [];
  for (let c=0; c<DATA.categories.length; c++){
    const s = scored.get(c)||[];
    avgs.push({ c, avg: s.length ? s.reduce((a,b)=>a+b,0)/s.length : 0, n: counts.get(c)||0 });
  }
  const med = avgs.map(a=>a.avg).sort((a,b)=>a-b)[Math.floor(avgs.length/2)];
  for (const {c,avg,n} of avgs){
    if (n <= 22 && n >= 4 && avg > med*1.25) gapCats.add(c);
  }
}

// ---------- filtering ----------
function visibleTools(){
  return DATA.tools.filter(t => t[5] <= day);
}
function matchQuery(t){
  if (!searchQ) return false;
  const q = searchQ.toLowerCase();
  return t[0].toLowerCase().includes(q) || (t[8]||'').toLowerCase().includes(q)
      || DATA.categories[t[6]].toLowerCase().includes(q);
}

// ---------- draw ----------
function draw(){
  if (!DATA) return;
  ctx.clearRect(0,0,W,H);
  // bg
  const bg = ctx.createRadialGradient(W*0.42, H*0.5, 60, W*0.42, H*0.5, Math.max(W,H)*0.7);
  bg.addColorStop(0, '#0a0f1c'); bg.addColorStop(1, '#05070d');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.k, view.k);

  const vis = visibleTools();
  const perCat = new Map();
  for (const t of vis){
    const c = t[6];
    if (!perCat.has(c)) perCat.set(c, {count:0, score:0, tools:[]});
    const p = perCat.get(c);
    p.count++; p.score += t[2]; p.tools.push(t);
  }

  // backbone: connect each bubble to its 2 nearest neighbors
  const centers = DATA.categories.map((_,c) => {
    const p = bubblePos[c];
    return { c, x:p.x, y:p.y, r: bubbleR(perCat.get(c)?.count || 0) };
  });
  ctx.lineWidth = 1 / view.k;
  const drawnLinks = new Set();
  for (const a of centers){
    const dists = centers.filter(b=>b.c!==a.c)
      .map(b=>({ b, d:(a.x-b.x)**2+(a.y-b.y)**2 }))
      .sort((x,y)=>x.d-y.d).slice(0,2);
    for (const {b} of dists){
      const key = Math.min(a.c,b.c) + ':' + Math.max(a.c,b.c);
      if (drawnLinks.has(key)) continue;
      drawnLinks.add(key);
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const cx = mx + (my - H/2)*0.22, cy = my - (mx - W/2)*0.22;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(cx,cy,b.x,b.y);
      ctx.strokeStyle='rgba(90,110,150,0.15)'; ctx.stroke();
    }
  }

  // bubbles
  DATA.categories.forEach((name, c) => {
    const p = bubblePos[c];
    const st = perCat.get(c) || {count:0, score:0};
    const r = bubbleR(st.count);
    const rising = risingCats.has(c), gap = gapCats.has(c);
    const dim = searchQ && !st.tools.some(matchQuery);

    // halo
    const tint = gap ? '255,180,84' : (rising ? '255,180,84' : '120,150,200');
    const halo = ctx.createRadialGradient(p.x,p.y,r*0.3, p.x,p.y,r*1.9);
    halo.addColorStop(0, `rgba(${tint},${dim?0.04:0.15})`);
    halo.addColorStop(1, `rgba(${tint},0)`);
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(p.x,p.y,r*1.9,0,7); ctx.fill();

    // body
    const body = ctx.createRadialGradient(p.x-r*0.3,p.y-r*0.3,r*0.1, p.x,p.y,r);
    body.addColorStop(0, dim?'#1a2233':'#2a3550'); body.addColorStop(1, dim?'#0e1420':'#131a2a');
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill();

    // ring
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7);
    ctx.lineWidth = 1.4/view.k;
    if (gap){ ctx.setLineDash([5,5]); ctx.strokeStyle='#ffb454'; }
    else if (rising){ ctx.setLineDash([]); ctx.strokeStyle='#ffb454'; }
    else { ctx.setLineDash([]); ctx.strokeStyle='#223048'; }
    ctx.stroke(); ctx.setLineDash([]);

    // inner texture
    let seed = c*97+7;
    const rnd = ()=>{ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; };
    const dots = Math.min(st.count, 18);
    for (let i=0;i<dots;i++){
      const a=rnd()*Math.PI*2, d=rnd()*r*0.78;
      ctx.beginPath(); ctx.arc(p.x+Math.cos(a)*d, p.y+Math.sin(a)*d, Math.max(0.6, rnd()*1.4)/view.k, 0, 7);
      ctx.fillStyle = `rgba(220,230,248,${dim?0.05:0.18+rnd()*0.25})`; ctx.fill();
    }

    // label
    const fs = 13/view.k;
    ctx.textAlign='center';
    ctx.font = `700 ${fs}px "Space Grotesk", sans-serif`;
    ctx.fillStyle = (gap||rising) && !dim ? '#ffb454' : (dim ? '#3a4860' : '#cdd6e4');
    ctx.fillText(name, p.x, p.y + r + (22/view.k));
    ctx.font = `400 ${11/view.k}px "JetBrains Mono", monospace`;
    ctx.fillStyle = dim ? '#2a3648' : '#5f6b80';
    ctx.fillText(`${st.count}${gap?' · gap':(rising?' ▲':'')}`, p.x, p.y + r + (40/view.k));
  });

  // drill-in stars
  if (selected !== null){
    const p = bubblePos[selected];
    const st = perCat.get(selected);
    if (st && st.count){
      const r = bubbleR(st.count);
      const arr = st.tools.slice().sort((a,b)=>b[2]-a[2]);
      arr.forEach((t,i)=>{
        const a = i*2.39996 + 0.7;
        const ring = i < 8;
        const dd = ring ? r + 42 + i*9 : r*(0.35 + Math.sqrt(i)*0.06);
        const x = p.x + Math.cos(a)*dd, y = p.y + Math.sin(a)*dd;
        const sr = Math.max(2.5, Math.sqrt(t[2]||2)*1.2)/view.k;
        const col = safeColor(t[1]);
        ctx.shadowColor = col; ctx.shadowBlur = 14/view.k;
        ctx.beginPath(); ctx.arc(x,y,sr,0,7); ctx.fillStyle = col; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(x,y,sr*0.42,0,7); ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill();
        if (matchQuery(t)){
          ctx.beginPath(); ctx.arc(x,y,sr+4/view.k,0,7); ctx.lineWidth=1.5/view.k;
          ctx.strokeStyle='#ffb454'; ctx.stroke();
        }
        // label only the top 8 by score
        if (i < 8){
          ctx.textAlign='left';
          ctx.font = `600 ${11/view.k}px "JetBrains Mono", monospace`;
          ctx.fillStyle='#cdd6e4'; ctx.fillText(t[0], x+sr+6, y+3);
          ctx.fillStyle='#ffb454'; ctx.font=`400 ${10/view.k}px "JetBrains Mono", monospace`;
          ctx.fillText(String(t[2]), x+sr+6, y+16);
        }
      });
    }
  }

  ctx.restore();
  updateStrip(vis, perCat);
}

// ---------- signal strip ----------
function updateStrip(vis, perCat){
  $('sTools').innerHTML = `<b>${vis.length}</b> tools`;
  const n = vis.length || 1;
  const hn = vis.filter(t=>t[4]===0).length, rd = vis.filter(t=>t[4]===1).length, xr = vis.filter(t=>t[4]===2).length;
  $('sSplit').textContent = `HN ${Math.round(hn/n*100)}% · Reddit ${Math.round(rd/n*100)}% · X ${Math.round(xr/n*100)}%`;
  $('sRising').innerHTML = risingCats.size ? `<span class="up">${risingCats.size} rising ▲</span>` : '';
  $('sGap').innerHTML = gapCats.size ? `<span class="up">${gapCats.size} gap</span>` : '';
}

// ---------- panel ----------
let panelShifted = false;
function openPanel(c){
  selected = c;
  if (!panelShifted){ view.x -= 165; panelShifted = true; }  // make room for the panel
  const st = visibleTools().filter(t=>t[6]===c).sort((a,b)=>b[2]-a[2]);
  $('pTitle').textContent = DATA.categories[c];
  const avg = st.length ? Math.round(st.filter(t=>t[2]>0).reduce((s,t)=>s+t[2],0)/Math.max(1,st.filter(t=>t[2]>0).length)) : 0;
  const top = st.length ? st[0][2] : 0;
  $('pSub').textContent = `${st.length} star${st.length===1?'':'s'}${risingCats.has(c)?' · rising ▲':''}${gapCats.has(c)?' · gap':''} · avg ${avg} · top ${top}`;
  const rows = $('pRows'); rows.innerHTML = '';
  if (!st.length){ rows.innerHTML = '<div class="empty">no stars at this day yet</div>'; }
  st.slice(0, 40).forEach(t=>{
    const d = document.createElement('div'); d.className='row';
    d.innerHTML = `<div class="top"><span class="n"><span class="sw" style="color:${safeColor(t[1])};background:${safeColor(t[1])}"></span><span class="nm">${escapeHtml(t[0])}</span></span><span class="s">${t[2]||'—'}</span></div><span class="tag">${escapeHtml(t[8]||'')}</span>`;
    d.onclick = () => t[9] && window.open(t[9], '_blank');
    rows.appendChild(d);
  });
  $('panel').classList.add('open');
}
function closePanel(){ selected=null; if (panelShifted){ view.x += 165; panelShifted = false; } $('panel').classList.remove('open'); draw(); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
// scraped colors are external data — only allow hex, else fallback (defends innerHTML style attr + canvas)
function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : '#9aa4b2'; }

// ---------- timeline ----------
function setDay(d){
  day = Math.max(0, Math.min(DATA.dates.length-1, d));
  slider.value = day;
  const span = Math.max(1, DATA.dates.length-1);   // guard the single-day payload
  fill.style.width = (day/span*100) + '%';
  dayLabel.textContent = `day ${day+1} / ${DATA.dates.length}`;
  draw();
  if (selected !== null) openPanel(selected);  // keep the panel in sync with the day
}
function togglePlay(){
  playing = !playing;
  $('play').classList.toggle('playing', playing);
  if (playing){
    playTimer = setInterval(()=>{
      if (day >= DATA.dates.length-1){ stopPlay(); return; }
      setDay(day+1);
    }, 350);
  } else stopPlay();
}
function stopPlay(){ playing=false; clearInterval(playTimer); $('play').classList.remove('playing'); }
$('play').onclick = togglePlay;
slider.addEventListener('input', ()=>{ stopPlay(); setDay(+slider.value); });
$('reset').onclick = ()=>{ view.k=1; view.x=0; view.y=0; draw(); };

// ---------- pan / zoom ----------
let drag = null;
cv.addEventListener('pointerdown', e=>{ drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false}; cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{
  if (!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if (Math.abs(dx)+Math.abs(dy) > 4) drag.moved = true;
  if (!drag.moved) return;              // don't nudge the view on sub-threshold clicks
  view.x = drag.vx + dx; view.y = drag.vy + dy;
  draw();
});
cv.addEventListener('pointercancel', ()=>{ drag = null; cv.classList.remove('dragging'); });
cv.addEventListener('pointerup', e=>{
  cv.classList.remove('dragging');
  if (drag && !drag.moved){
    // click: hit-test bubbles
    const mx = (e.clientX - view.x)/view.k, my = (e.clientY - view.y)/view.k;
    let hit = null, best = Infinity;
    DATA.categories.forEach((_,c)=>{
      const p = bubblePos[c];
      const r = bubbleR(visibleTools().filter(t=>t[6]===c).length) + 6;
      const d = (mx-p.x)**2 + (my-p.y)**2;
      if (d < r*r && d < best){ best = d; hit = c; }
    });
    if (hit !== null){ openPanel(hit); draw(); }
    else closePanel();
  }
  drag = null;
});
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = Math.exp(-e.deltaY*0.0012);
  const nk = Math.max(0.35, Math.min(7, view.k*f));
  const mx = e.clientX, my = e.clientY;
  view.x = mx - (mx - view.x)*(nk/view.k);
  view.y = my - (my - view.y)*(nk/view.k);
  view.k = nk;
  draw();
}, {passive:false});

// ---------- search ----------
$('search').addEventListener('input', e=>{
  searchQ = e.target.value.trim();
  if (!searchQ){ closePanel(); }
  draw();
});
$('search').addEventListener('keydown', e=>{
  if (e.key === 'Enter' && searchQ){
    const m = visibleTools().find(matchQuery);
    if (m){ openPanel(m[6]); draw(); }
  }
});
addEventListener('keydown', e=>{ if (e.key === 'Escape' && selected !== null) closePanel(); });

// ---------- init ----------
fetch('app.json').then(r=>r.json()).then(d=>{
  DATA = d;
  document.title = `NEBULA — ${d.tools.length} tools, one sky`;
  day = d.dates.length-1;
  slider.max = d.dates.length-1;
  slider.value = day;
  fill.style.width = '100%';
  dayLabel.textContent = `day ${d.dates.length} / ${d.dates.length}`;
  computeSignals();
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>draw());
}).catch(e=>{
  const pre = document.createElement('pre');
  pre.style.cssText = 'color:#f87171;padding:20px';
  pre.textContent = 'failed to load app.json: ' + e;
  document.body.appendChild(pre);
});
</script>
</body>
</html>
